# Claude / Anthropic cache-friendly new-api sidecar (loopback :3001).
# Shares MySQL `newapi` DB with main gateway; uses Redis logical DB 1.
# Deploy: tune_newapi_kimi_cache.sh (never commit .env with secrets)

services:
  newapi-claude:
    image: calciumion/new-api:latest
    container_name: newapi-claude
    restart: unless-stopped
    command: --log-dir /app/logs --port 3001
    network_mode: host
    volumes:
      - ./data-claude:/data
      - ./logs-claude:/app/logs
    env_file:
      - .env.kimi-cache
    environment:
      - SQL_DSN=${NEWAPI_MYSQL_USER}:${NEWAPI_MYSQL_PASS}@tcp(127.0.0.1:3306)/newapi
      - REDIS_CONN_STRING=${REDIS_CONN_STRING_CLAUDE}
      - PORT=3001
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/api/status | grep -o '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
