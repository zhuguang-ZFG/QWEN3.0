      description: HTTP Upgrade to WebSocket for streaming ASR. Connect with `?ticket=` from POST /device/v1/app/voice/ticket. Send PCM binary frames (16 kHz mono), text `stop` to finalize, text `ping` for keepalive. Server replies with JSON `{type:transcript|pong|error}`. WS does not return intent — use REST /voice/transcribe or client-side resolve. See docs-site/api/voice.md.
      parameters: [*id001]
      responses: *id002
