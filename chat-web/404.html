<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在 | LiMa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0a0a0f; color: #e2e8f0; padding: 24px; text-align: center;
    }
    .card {
      max-width: 28rem; padding: 2rem 1.5rem; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: .02em; }
    p { margin: 0 0 1.25rem; color: #94a3b8; line-height: 1.5; font-size: .95rem; }
    a {
      display: inline-block; padding: .6rem 1rem; border-radius: 8px; text-decoration: none;
      color: #0a0a0f; font-weight: 600; background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>页面不存在或已下线。若你在找 API Key 管理页，该能力已移除。</p>
    <a href="/">返回控制台</a>
  </div>
</body>
</html>
