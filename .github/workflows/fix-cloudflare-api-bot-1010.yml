name: Fix Cloudflare API Bot Block (1010)

# Skip Bot Fight / Browser Integrity / UA blocks for api.donglicao.com
# Root cause: CF blocks User-Agent like "OpenAI/Python 1.0" with 403 "Your request was blocked" (1010).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Apply skip rule for api.donglicao.com
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ZONE_NAME = "donglicao.com"
          HOST = "api.donglicao.com"
          RULE_DESC = "LiMa NewAPI: skip bot/BIC/UA for api.donglicao.com (fix CF 1010)"

          def api(method, url, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
              )
              if data is not None:
                  req.data = json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  try:
                      parsed = json.loads(body)
                  except json.JSONDecodeError:
                      parsed = {"success": False, "errors": [{"message": body[:500]}], "http": e.code}
                  parsed.setdefault("http", e.code)
                  return parsed

          zones = api("GET", f"https://api.cloudflare.com/client/v4/zones?name={ZONE_NAME}")
          if not zones.get("success") or not zones.get("result"):
              raise SystemExit(f"zone lookup failed: {zones}")
          zone_id = zones["result"][0]["id"]
          print("zone_id", zone_id)

          # Snapshot security settings
          for key in ("security_level", "browser_check"):
              r = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/settings/{key}")
              print(key, r.get("success"), (r.get("result") or {}).get("value"))

          phase = "http_request_firewall_custom"
          entry_url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/{phase}/entrypoint"
          entry = api("GET", entry_url)
          print("entrypoint_get", entry.get("success"), entry.get("errors"))

          expression = f'(http.host eq "{HOST}")'
          new_rule = {
              "action": "skip",
              "action_parameters": {
                  # bic=Browser Integrity Check (1010), uaBlock=UA bans, hot=Hotlink, securityLevel, waf, rateLimit
                  "products": [
                      "bic",
                      "uaBlock",
                      "hot",
                      "securityLevel",
                      "rateLimit",
                      "waf",
                      "zoneLockdown",
                  ],
              },
              "description": RULE_DESC,
              "enabled": True,
              "expression": expression,
          }

          if entry.get("success") and entry.get("result"):
              ruleset_id = entry["result"]["id"]
              rules = list(entry["result"].get("rules") or [])
              # upsert by description
              replaced = False
              for i, rule in enumerate(rules):
                  if rule.get("description") == RULE_DESC or (
                      rule.get("action") == "skip" and HOST in (rule.get("expression") or "")
                  ):
                      rules[i] = {**rule, **new_rule, "id": rule.get("id")}
                      replaced = True
                      break
              if not replaced:
                  rules.insert(0, new_rule)
              upd = api(
                  "PUT",
                  f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/{ruleset_id}",
                  {"rules": rules},
              )
              print("ruleset_update", upd.get("success"), upd.get("errors"))
              if not upd.get("success"):
                  raise SystemExit(upd)
          else:
              # create entrypoint ruleset
              created = api(
                  "POST",
                  f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets",
                  {
                      "name": "LiMa custom firewall",
                      "kind": "zone",
                      "phase": phase,
                      "rules": [new_rule],
                  },
              )
              print("ruleset_create", created.get("success"), created.get("errors"))
              if not created.get("success"):
                  raise SystemExit(created)

          # Also try Configuration Rules: disable Bot Fight for this host if phase exists
          cfg_phase = "http_config_settings"
          cfg_entry = api(
              "GET",
              f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/{cfg_phase}/entrypoint",
          )
          print("config_entrypoint", cfg_entry.get("success"), cfg_entry.get("errors"))
          if cfg_entry.get("success") and cfg_entry.get("result"):
              cfg_id = cfg_entry["result"]["id"]
              cfg_rules = list(cfg_entry["result"].get("rules") or [])
              cfg_rule = {
                  "action": "set_config",
                  "action_parameters": {
                      "security_level": "essentially_off",
                  },
                  "description": "LiMa NewAPI: security_level essentially_off for api host",
                  "enabled": True,
                  "expression": expression,
              }
              replaced = False
              for i, rule in enumerate(cfg_rules):
                  if "NewAPI: security_level" in (rule.get("description") or ""):
                      cfg_rules[i] = {**rule, **cfg_rule, "id": rule.get("id")}
                      replaced = True
                      break
              if not replaced:
                  cfg_rules.insert(0, cfg_rule)
              cfg_upd = api(
                  "PUT",
                  f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/{cfg_id}",
                  {"rules": cfg_rules},
              )
              print("config_update", cfg_upd.get("success"), cfg_upd.get("errors"))

          # Verify DNS record exists (informational)
          dns = api(
              "GET",
              f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={HOST}&type=A",
          )
          if dns.get("success"):
              for rec in dns.get("result") or []:
                  print(
                      "dns",
                      rec.get("name"),
                      rec.get("content"),
                      "proxied=",
                      rec.get("proxied"),
                  )
          print("DONE")
          PY
