name: Fix Cloudflare API Bot Block (1010)

# api.donglicao.com is an API gateway; CF Bot Fight blocks OpenAI-style UAs (403/1010).
# GH CLOUDFLARE_API_TOKEN can edit DNS but not WAF rulesets — grey-cloud (DNS only)
# sends traffic straight to Aliyun origin and eliminates Bot Fight for this host.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dns_only (recommended) | restore_proxy"
        required: true
        default: dns_only
        type: choice
        options:
          - dns_only
          - restore_proxy

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Toggle api.donglicao.com Cloudflare proxy
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ZONE_NAME = "donglicao.com"
          HOST = "api.donglicao.com"
          MODE = os.environ.get("MODE", "dns_only")
          WANT_PROXIED = MODE != "dns_only"

          def api(method, url, data=None):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
              )
              if data is not None:
                  req.data = json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  try:
                      parsed = json.loads(body)
                  except json.JSONDecodeError:
                      parsed = {"success": False, "errors": [{"message": body[:500]}]}
                  parsed["http"] = e.code
                  return parsed

          zones = api("GET", f"https://api.cloudflare.com/client/v4/zones?name={ZONE_NAME}")
          if not zones.get("success") or not zones.get("result"):
              raise SystemExit(f"zone lookup failed: {zones}")
          zone_id = zones["result"][0]["id"]
          print("zone_id", zone_id, "mode", MODE, "want_proxied", WANT_PROXIED)

          dns = api(
              "GET",
              f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={HOST}",
          )
          if not dns.get("success"):
              raise SystemExit(f"dns list failed: {dns}")
          recs = dns.get("result") or []
          if not recs:
              raise SystemExit(f"no DNS records for {HOST}: {dns}")

          for rec in recs:
              print(
                  "before",
                  rec.get("id"),
                  rec.get("type"),
                  rec.get("content"),
                  "proxied=",
                  rec.get("proxied"),
              )
              if rec.get("type") not in ("A", "AAAA", "CNAME"):
                  continue
              if bool(rec.get("proxied")) == WANT_PROXIED:
                  print("already desired state, skip", rec["id"])
                  continue
              payload = {
                  "type": rec["type"],
                  "name": rec["name"],
                  "content": rec["content"],
                  "ttl": 1 if WANT_PROXIED else 300,
                  "proxied": WANT_PROXIED,
              }
              upd = api(
                  "PUT",
                  f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{rec['id']}",
                  payload,
              )
              print("update", upd.get("success"), upd.get("errors"))
              if not upd.get("success"):
                  raise SystemExit(upd)
              result = upd.get("result") or {}
              print(
                  "after",
                  result.get("type"),
                  result.get("content"),
                  "proxied=",
                  result.get("proxied"),
              )

          print("DONE", "proxied=" + str(WANT_PROXIED))
          PY
